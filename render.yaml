services:
  - type: web
    name: wegrow-exam
    env: node
    plan: free
    buildCommand: npm install --force && npm rebuild better-sqlite3
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
