services:
  - type: web
    name: wegrow-exam
    env: node
    plan: free
    buildCommand: npm install && npm rebuild better-sqlite3 --build-from-source && node generators/load_all_to_db.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
